spring:
  application:
    name: health-assistant
  profiles:
    active: dev

  # MySQL 业务数据
  datasource:
    url: jdbc:mysql://localhost:3306/health_assistant?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 缓存 & 会话
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
      timeout: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "ha:cache:"

  # DashScope（Spring AI Alibaba 自动配置）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        enabled: true
        options:
          model: qwen-max
          temperature: 0.7
          max-tokens: 2048
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

  # Elasticsearch
  elasticsearch:
    uris: ${ES_URIS:localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  # Spring AI Elasticsearch VectorStore
  ai:
    vectorstore:
      elasticsearch:
        index-name: health_knowledge
        dimensions: 1024
        similarity: cosine
        initialize-schema: true

# 应用自定义配置
app:
  chat:
    max-history: 10
    stream-timeout: 30000
  evidence:
    weights:
      source: 0.5
      time: 0.3
      type: 0.2
  security:
    jwt:
      secret: ${JWT_SECRET:health-assistant-default-secret-change-in-production}
      expiration: 7200000
      refresh-expiration: 604800000
  crawler:
    enable-scheduled: false
    max-depth: 3
    request-interval: 2000

# SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

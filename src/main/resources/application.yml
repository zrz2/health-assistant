spring:
  application:
    name: health-assistant
  main:
    allow-bean-definition-overriding: true

  # MySQL 业务数据
  datasource:
    url: jdbc:mysql://localhost:3306/health_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 缓存 & 会话
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
      timeout: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "ha:cache:"

  # Spring AI（DashScope + Elasticsearch VectorStore）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        enabled: true
        options:
          model: qwen-max
          temperature: 0.7
          max-tokens: 2048
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
    vectorstore:
      elasticsearch:
        index-name: health_knowledge
        dimensions: 1024
        similarity: cosine
        initialize-schema: true

  # Elasticsearch 连接
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

# 应用自定义配置
app:
  chat:
    max-history: 10
    stream-timeout: 120000
  rag:
    enabled: true  # Phase 2: RAG 检索增强生成
    top-k: 5
  evidence:
    weights:
      source: 0.5
      time: 0.3
      type: 0.2
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 7200000
      refresh-expiration: 604800000
  crawler:
    enable-scheduled: false
    max-depth: 3
    request-interval: 2000

  # 数据抓取模块 — 从 WHO、CDC、丁香医生等自动导入健康知识
  scraper:
    enabled: true
    sources:
      who:
        enabled: true
        max-articles: 10
      cdc:
        enabled: true
        max-articles: 10
      dingxiang:
        enabled: true
        max-articles: 8
      # 新增来源
      nhc:
        enabled: true
        max-articles: 15
      medjournals:
        enabled: true
        max-articles: 10
      medlive:
        enabled: true
        max-articles: 20
      ahospital:
        enabled: true
        max-articles: 30
    # 证据分级（基于来源自动标注）
    evidence-defaults:
      WHO: 5
      中国疾控中心: 4
      丁香医生: 2
      国家卫健委: 5
      中华医学期刊网: 4
      医脉通: 3
      A+医学百科: 2

# SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
